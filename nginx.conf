# Nginx Hardened Production Configuration for KrishiSeva
# Network Security, Anti-Fingerprinting, and Web Application Firewall ACLs

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
  listen 80;
  listen [::]:80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # 1. Anti-Fingerprinting (Hide Nginx Version)
  server_tokens off;

  # 2. Buffer Size & Resource Exhaustion Defense
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # 3. Connection Limits (Anti-Slowloris / DoS)
  limit_conn conn_limit 50;

  # 4. Hardened Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:* ws://localhost:* https:;" always;

  # 5. Block Access to Hidden Files, Dotfiles, and Version Control
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # 6. Block Sensitive File Extensions (.env, .git, .sql, .bak, .yml, .sh)
  location ~* \.(env|git|sql|bak|yml|yaml|sh|log|md)$ {
    deny all;
    return 404;
  }

  # Frontend Single Page App Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend Reverse Proxy (with Rate Limiting & SSE support)
  location /api {
    limit_req zone=api_limit burst=50 nodelay;

    proxy_pass http://backend:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (SSE) & WebSocket real-time queues
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
}
