name: Security & Infrastructure CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Security & IaC Verification
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Infrastructure as Code (IaC) Security Scan
        run: node scripts/validate_iac_security.js

      - name: Dependency & Supply Chain Vulnerability Scan
        run: node scripts/scan_dependencies.js

      - name: Software Bill of Materials (SBOM) Verification
        run: node scripts/generate_sbom.js

      - name: Static Application Security Testing (SAST)
        run: node scripts/sast_scanner.js

      - name: Secret Leak & Exposed Credential Scan
        run: node scripts/scan_secrets.js

      - name: Build Backend & Frontend
        run: |
          npm run build --workspace=apps/backend
          npm run build --workspace=apps/frontend

      - name: Dynamic Application Security Testing (DAST)
        run: node scripts/dast_scanner.js

      - name: Run Unified Enterprise Security Master Test Suite (Sections 1-11)
        run: |
          # Master runner orchestrating all test suites across Sections 1 to 11
          node scripts/run_all_security_tests.js
