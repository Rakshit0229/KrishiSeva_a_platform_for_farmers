version: '3.9'

networks:
  public_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true # Strictly isolated internal network with no external gateway access

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - db_net
    # No host port publishing (isolated from external network attacks)
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krishi_procurement}
      POSTGRES_USER: ${POSTGRES_USER:-krishi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishi_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001.sql
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krishi_user} -d ${POSTGRES_DB:-krishi_procurement}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-krishi_redis_secure_pass}
    networks:
      - db_net
    # No host port publishing (internal to db_net only)
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-krishi_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend_net
      - db_net
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-krishi_user}:${POSTGRES_PASSWORD:-krishi_password}@postgres:5432/${POSTGRES_DB:-krishi_procurement}
      REDIS_URL: redis://:${REDIS_PASSWORD:-krishi_redis_secure_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-krishiseva_secure_secret_key_change_in_production}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-krishi_aes_master_encryption_key_2026}
      CSRF_SECRET: ${CSRF_SECRET:-krishi_csrf_salt_secret_2026}
      WEIGHBRIDGE_API_KEY: ${WEIGHBRIDGE_API_KEY:-krishiseva_iot_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - public_net
      - backend_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
